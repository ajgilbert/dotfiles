# Starship prompt config — symlinked to ~/.config/starship.toml
# Docs: https://starship.rs/config/

"$schema" = 'https://starship.rs/config-schema.json'

# Short host label first, then every other module in its default order.
format = '${env_var.SHORT_HOSTNAME}$all'

# Host label computed in bashrc (SHORT_HOSTNAME), so the renaming rules
# (lxplus9xx -> lxp9, llruicms01 -> llrcms, ...) live in one place.
[env_var.SHORT_HOSTNAME]
format = '[$env_value]($style) '
style = 'bold yellow'

# Replaced by the env_var module above (would otherwise duplicate it over ssh).
[hostname]
disabled = true

[directory]
truncation_length = 6
